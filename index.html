<!-- Farmer Submission Form -->
<div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 my-8">
    <h2 class="text-xl font-bold text-slate-800 mb-4">📢 Submit Field Disease Report</h2>
    <form id="githubIssueForm" class="space-y-4">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
                <label class="block text-sm font-medium text-slate-700">Farmer / Reporter Name</label>
                <input type="text" id="reporterName" required class="w-full px-3 py-2 border rounded-lg text-sm">
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-700">Location / District</label>
                <input type="text" id="reporterLocation" required class="w-full px-3 py-2 border rounded-lg text-sm">
            </div>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
                <label class="block text-sm font-medium text-slate-700">Crop Name</label>
                <input type="text" id="reporterCrop" required placeholder="e.g. Cotton, Wheat" class="w-full px-3 py-2 border rounded-lg text-sm">
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-700">Contact / WhatsApp</label>
                <input type="text" id="reporterContact" required class="w-full px-3 py-2 border rounded-lg text-sm">
            </div>
        </div>
        <div>
            <label class="block text-sm font-medium text-slate-700">Observed Symptoms / Notes</label>
            <textarea id="reporterSymptoms" rows="3" required class="w-full px-3 py-2 border rounded-lg text-sm"></textarea>
        </div>
        <button type="submit" id="issueSubmitBtn" class="bg-emerald-600 hover:bg-emerald-700 text-white font-medium px-6 py-2 rounded-lg text-sm transition">
            Save Report to GitHub
        </button>
    </form>
    <p id="issueStatus" class="mt-3 text-sm font-semibold hidden"></p>
</div>

<script>
    // Configuration - Replace with your GitHub Username, Repository Name, and Token
    const GH_USERNAME = "YOUR_GITHUB_USERNAME";
    const GH_REPO = "crop-disease-advisory";
    const GH_TOKEN = "YOUR_FINE_GRAINED_TOKEN_HERE"; 

    document.getElementById('githubIssueForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const btn = document.getElementById('issueSubmitBtn');
        const status = document.getElementById('issueStatus');

        btn.disabled = true;
        btn.innerText = "Saving to GitHub...";

        const name = document.getElementById('reporterName').value;
        const location = document.getElementById('reporterLocation').value;
        const crop = document.getElementById('reporterCrop').value;
        const contact = document.getElementById('reporterContact').value;
        const symptoms = document.getElementById('reporterSymptoms').value;

        // Issue Payload
        const issueData = {
            title: `[Field Report] ${crop} issue in ${location}`,
            body: `### 🌾 Farmer Field Report\n\n` +
                  `* **Reporter Name:** ${name}\n` +
                  `* **Location:** ${location}\n` +
                  `* **Crop:** ${crop}\n` +
                  `* **Contact:** ${contact}\n` +
                  `* **Submitted Date:** ${new Date().toLocaleString()}\n\n` +
                  `### 🔍 Observed Symptoms\n${symptoms}`,
            labels: ["farmer-report", crop.toLowerCase()]
        };

        fetch(`https://api.github.com/repos/${GH_USERNAME}/${GH_REPO}/issues`, {
            method: 'POST',
            headers: {
                'Authorization': `token ${GH_TOKEN}`,
                'Accept': 'application/vnd.github.v3+json',
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(issueData)
        })
        .then(response => {
            if (!response.ok) throw new Error("Failed to post to GitHub");
            return response.json();
        })
        .then(data => {
            status.innerText = `✓ Report saved successfully as GitHub Issue #${data.number}!`;
            status.className = "mt-3 text-sm font-semibold text-emerald-600 block";
            document.getElementById('githubIssueForm').reset();
        })
        .catch(err => {
            status.innerText = "✖ Error saving report. Check your repository details & token permissions.";
            status.className = "mt-3 text-sm font-semibold text-red-600 block";
        })
        .finally(() => {
            btn.disabled = false;
            btn.innerText = "Save Report to GitHub";
        });
    });
</script>
